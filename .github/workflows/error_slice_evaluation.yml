name: GridPulse Error Slice Evaluation

on:
  push:
    branches:
      - feature/model-error-intelligence
    paths:
      - .github/workflows/error_slice_evaluation.yml
      - src/gridpulse/slicing.py
      - scripts/generate_error_slices.py

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GridPulse
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch and verify frozen EIA-930 snapshot
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          files = {
              "EIA930_BALANCE_2022_Jan_Jun.csv": "d3d315a0c29d9527a1c64cf6ddcdcc5c0b7281fddd99199bd70f06d242e503d5",
              "EIA930_BALANCE_2022_Jul_Dec.csv": "267575c29ef40f386bcf3bc3993013b9ce13a3a154b89b702559a75dd742976d",
              "EIA930_BALANCE_2023_Jan_Jun.csv": "a0e14e9c07ab4cc1de3e384c7be890b0c61d9de3fe04ad3ae5ec739f1f35ec1b",
              "EIA930_BALANCE_2023_Jul_Dec.csv": "c719fc1b513eec8982ce209b6e3173fc64b2d0d243f83d3bf0d8d1adf6222de2",
              "EIA930_BALANCE_2024_Jan_Jun.csv": "26768c495c3ba987e29d79df2e40d4e741f9dbcff086f53c12ff774465756a10",
              "EIA930_BALANCE_2024_Jul_Dec.csv": "a602a8e577cfdd2fa3083413eaa4dd8ba7f0d2b26a2986f8f6d22917465ea49f",
              "EIA930_BALANCE_2025_Jan_Jun.csv": "fac4bb991dfa1dab3b4b35300ccab54ac99be13a40ce91954db8ddafb2816242",
              "EIA930_BALANCE_2025_Jul_Dec.csv": "1146158b972439db7c7f4cc7d0491e07644ddbf244d03b8ecb44cb2c833d10f1",
          }
          target = Path("data/raw/eia930")
          target.mkdir(parents=True, exist_ok=True)
          verification = []
          for filename, expected in files.items():
              url = f"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/{filename}"
              req = urllib.request.Request(url, headers={"User-Agent": "GridPulse error-slice reproducibility"})
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected:
                  raise RuntimeError(f"Hash mismatch for {filename}: {digest} != {expected}")
              (target / filename).write_bytes(data)
              verification.append({"file": filename, "sha256": digest, "bytes": len(data)})
              print(f"VERIFIED {filename}: {digest}")
          Path("slice_source_verification.json").write_text(json.dumps(verification, indent=2) + "\n")
          PY

      - name: Prepare PJM analytical data
        run: |
          python scripts/prepare_downloaded_eia.py \
            --balance-source data/raw/eia930 \
            --respondent PJM \
            --output-dir data/processed

      - name: Generate 2025 error slices
        run: |
          python scripts/generate_error_slices.py \
            --hourly-path data/processed/gridpulse_hourly.parquet \
            --respondent PJM \
            --test-start 2025-01-01 \
            --output-dir results/error_slices

      - name: Upload compact slice evidence
        uses: actions/upload-artifact@v4
        with:
          name: gridpulse-error-slices
          if-no-files-found: error
          retention-days: 7
          path: |
            results/error_slices/
            slice_source_verification.json
