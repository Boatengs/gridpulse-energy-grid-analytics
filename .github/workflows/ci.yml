name: GridPulse CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Streamlit deployment import smoke test
        run: python -c "import gridpulse; from gridpulse.demo import make_demo_data"
      - run: python -m compileall -q app.py pages src
      - run: pytest -q
