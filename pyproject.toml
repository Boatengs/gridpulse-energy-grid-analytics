[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-energy-grid-analytics"
version = "0.2.0"
description = "Energy demand, forecast-error, grid-stress, generation-mix and interchange analytics using EIA-930 data."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "plotly>=5.24",
  "streamlit>=1.42",
  "scikit-learn>=1.5",
  "pyarrow>=18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.9", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
